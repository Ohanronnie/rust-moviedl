[package]
name = "rust-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core networking
reqwest = { version = "0.11.18", features = ["blocking", "json", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "stream"] }

# Parallel processing
num_cpus = "1.16.0"
threadpool = "1.8.1"  # Now required

# Progress & UI
indicatif = { version = "0.17.6", features = ["improved_unicode"] }
dialoguer = "0.11.0"  # Now required

# CLI
structopt = "0.3.26"
ctrlc = "3.4.0"

# Data processing
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.100"
url = "2.5.0"
urlencoding = "2.1.3"
scraper = "0.18.1"  # Now required

# Performance
memmap2 = "0.5.10"

# Async runtime
tokio = { version = "1.29.1", features = ["full"] }
futures = "0.3.28"

[dev-dependencies]
tempfile = "3.6.0"
mockito = "1.1.0"
criterion = "0.5.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
incremental = false
